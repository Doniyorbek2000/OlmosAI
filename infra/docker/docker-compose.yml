# VEYRA 3D — local development stack.
#   docker compose -f infra/docker/docker-compose.yml up -d
# Core infra (postgres/redis/minio) always starts. App + workers are behind
# profiles so you can run them in Docker or via `pnpm dev` on the host.
#   --profile app      → api, api-worker, web
#   --profile workers  → triposr CPU worker (procedural fallback)
name: veyra

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: veyra
      POSTGRES_DB: veyra
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veyra']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['6379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the private assets bucket on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/veyra-assets &&
      mc anonymous set none local/veyra-assets &&
      echo 'bucket ready';
      "

  # ---- Application (profile: app) -------------------------------------------
  api:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ['node', 'apps/api/dist/main.js']
    env_file: ['../../.env']
    environment:
      DATABASE_URL: postgresql://veyra:veyra@postgres:5432/veyra?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ['4000:4000']

  api-worker:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ['node', 'apps/api/dist/worker.js']
    env_file: ['../../.env']
    environment:
      DATABASE_URL: postgresql://veyra:veyra@postgres:5432/veyra?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      TRIPOSR_WORKER_URL: http://triposr:8001
      ASSET_WORKER_URL: http://asset-worker:8010
      # Restricted (geo/MAU-gated) workers — reachable only when the operator
      # enables FEATURE_MOTION / FEATURE_WORLD_GENERATION.
      HYMOTION_WORKER_URL: http://hymotion:8006
      HYWORLD_WORKER_URL: http://hyworld:8007
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    env_file: ['../../.env']
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on: ['api']
    ports: ['3000:3000']

  # ---- AI workers (profile: workers) ----------------------------------------
  triposr:
    profiles: ['workers']
    build:
      context: ../..
      dockerfile: services/ai-workers/triposr/Dockerfile
    env_file: ['../../.env']
    environment:
      S3_ENDPOINT: http://minio:9000
      WORKER_GPU_AVAILABLE: 'false'
    depends_on:
      minio: { condition: service_healthy }
    ports: ['8001:8001']

  asset-worker:
    profiles: ['workers']
    build:
      context: ../..
      dockerfile: services/asset-worker/Dockerfile
    env_file: ['../../.env']
    environment:
      S3_ENDPOINT: http://minio:9000
    depends_on:
      minio: { condition: service_healthy }
    ports: ['8010:8010']

  # ---- Restricted AI workers (profile: restricted-workers) ------------------
  # HY-Motion / HY-World. DISABLED by default (Tencent Community licenses exclude
  # EU/UK/South Korea and cap at 1M MAU). Only run in a permitted territory with
  # legal sign-off. CPU procedural fallback here; GPU builds via Dockerfile.gpu.
  hymotion:
    profiles: ['restricted-workers']
    build:
      context: ../..
      dockerfile: services/ai-workers/hymotion/Dockerfile
    env_file: ['../../.env']
    environment:
      S3_ENDPOINT: http://minio:9000
      WORKER_GPU_AVAILABLE: 'false'
    depends_on:
      minio: { condition: service_healthy }
    ports: ['8006:8006']

  hyworld:
    profiles: ['restricted-workers']
    build:
      context: ../..
      dockerfile: services/ai-workers/hyworld/Dockerfile
    env_file: ['../../.env']
    environment:
      S3_ENDPOINT: http://minio:9000
      WORKER_GPU_AVAILABLE: 'false'
    depends_on:
      minio: { condition: service_healthy }
    ports: ['8007:8007']

  # ---- Observability (profile: observability) -------------------------------
  prometheus:
    profiles: ['observability']
    image: prom/prometheus:latest
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ['9090:9090']

  grafana:
    profiles: ['observability']
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ['3001:3000']
    depends_on: ['prometheus']

volumes:
  pgdata:
  redisdata:
  miniodata:
