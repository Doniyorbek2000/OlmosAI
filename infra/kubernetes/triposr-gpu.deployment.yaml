apiVersion: apps/v1
kind: Deployment
metadata:
  name: veyra-triposr-gpu
  namespace: veyra
spec:
  replicas: 1
  selector:
    matchLabels: { app: veyra-triposr }
  template:
    metadata:
      labels: { app: veyra-triposr, tier: gpu }
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-l4  # example; match your pool
      containers:
        - name: triposr
          image: veyra/triposr:gpu
          ports: [{ containerPort: 8001 }]
          env:
            - name: WORKER_GPU_AVAILABLE
              value: 'true'
          envFrom:
            - secretRef: { name: veyra-secrets }
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: '16Gi'
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: veyra-triposr
  namespace: veyra
spec:
  selector: { app: veyra-triposr }
  ports: [{ port: 8001, targetPort: 8001 }]
