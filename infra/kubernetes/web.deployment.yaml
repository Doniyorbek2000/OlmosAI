apiVersion: apps/v1
kind: Deployment
metadata:
  name: veyra-web
  namespace: veyra
spec:
  replicas: 2
  selector:
    matchLabels: { app: veyra-web }
  template:
    metadata:
      labels: { app: veyra-web }
    spec:
      containers:
        - name: web
          image: veyra/web:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: veyra-config }
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits: { cpu: '500m', memory: '512Mi' }
---
apiVersion: v1
kind: Service
metadata:
  name: veyra-web
  namespace: veyra
spec:
  selector: { app: veyra-web }
  ports: [{ port: 80, targetPort: 3000 }]
